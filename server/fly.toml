# The machine sleeps when idle and wakes on a request. A trial account stops a machine after
# five minutes anyway, so the relay runs by request on /relay/tick instead of a resident loop.
app = "fala-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  NETWORK = "mainnet"
  DB_URL = "file:/data/fala.db"
  # Mainnet float per agent wallet: enough for a few requests, small enough to survive a drain.
  AGENT_GAS_USDC = "0.02"
  # No resident relay loop: an awake machine costs money, and /relay/tick covers the work.
  RELAY = "0"
  # Origins allowed to call the API; the first is the one approval emails link to.
  WEB_ORIGINS = "https://fala-approve.vercel.app,http://localhost:3000"
  # Vault deploys and agent floats come out of the platform wallet, so bound what one account can spend.
  MAX_VAULTS_PER_USER = "2"
  # Real money: only these approver addresses may deploy a vault at our expense.
  ALLOWED_APPROVERS = "fala.approver.1@gmail.com"
  ARC_RPC = "https://rpc.mainnet.arc.io"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "fala_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
