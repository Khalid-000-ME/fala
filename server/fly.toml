# The machine sleeps when idle and wakes on a request. A trial account stops a machine after
# five minutes anyway, so the relay runs by request on /relay/tick instead of a resident loop.
app = "fala-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  NETWORK = "testnet"
  DB_URL = "file:/data/fala.db"
  AGENT_GAS_USDC = "0.3"
  # No resident relay loop: an awake machine costs money, and /relay/tick covers the work.
  RELAY = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "fala_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
