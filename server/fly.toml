# The relay polls IMAP and the chain every 15s, so this machine must never stop.
app = "fala-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  NETWORK = "testnet"
  DB_URL = "file:/data/fala.db"
  AGENT_GAS_USDC = "0.3"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[mounts]
  source = "fala_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
